<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #1a1a1a, #2b2b2b);
      color: #e6e6e6;
      padding: 30px;
    }

    h2, h3 {
      color: #d1b100;
      margin-bottom: 20px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: rgba(0, 66, 37, 0.1);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    .add-btn {
      padding: 12px 20px;
      background: #004225;
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
      transition: 0.3s;
      margin-bottom: 20px;
    }

    .add-btn:hover {
      background: #003218;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: rgba(255,255,255,0.05);
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 15px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    th {
      background-color: #004225;
      color: #fff;
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .delete-btn {
      background: #8B0000;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    .delete-btn:hover {
      background: #600000;
    }

    a {
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Admin Dashboard</h2>

    <a href="add-customer.html">
      <button class="add-btn">➕ Add New Customer</button>
    </a>

    <h3>Customer List</h3>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Number Plate</th>
          <th>Expiry Date</th>
          <th>Phone</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="customerTableBody">
        <!-- Customers will be added dynamically -->
      </tbody>
    </table>
  </div>

  <script>
    function displayCustomers() {
      let customers = JSON.parse(localStorage.getItem("customers")) || [];
      let tableBody = document.getElementById("customerTableBody");

      tableBody.innerHTML = "";

      customers.forEach((customer, index) => {
        let row = `<tr>
          <td>${customer.name}</td>
          <td>${customer.carNumber}</td>
          <td>${customer.expiryDate}</td>
          <td>${customer.phone}</td>
          <td><button class="delete-btn" onclick="deleteCustomer(${index})">Delete</button></td>
        </tr>`;
        tableBody.innerHTML += row;
      });
    }

    function deleteCustomer(index) {
      let customers = JSON.parse(localStorage.getItem("customers")) || [];
      customers.splice(index, 1);
      localStorage.setItem("customers", JSON.stringify(customers));
      displayCustomers();
    }

    document.addEventListener("DOMContentLoaded", function() {
      displayCustomers();
    });
  </script>
</body>
</html>
